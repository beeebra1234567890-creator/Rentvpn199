
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Unzip project
        run: |
          ls -la
          unzip -q -o ./*.zip
          ls -la RentVPN

      - name: Grant execute permission
        run: chmod +x RentVPN/gradlew

      - name: Build APK
        working-directory: RentVPN
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentVPN-APK
          path: RentVPN/**/build/outputs/apk/**/*.apk
          
