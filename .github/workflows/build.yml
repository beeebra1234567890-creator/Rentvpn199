
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Unzip project and find Gradle
        run: |
          mkdir -p source

          shopt -s nullglob
          archives=( *.zip )

          if [ ${#archives[@]} -gt 0 ]; then
            unzip -q -o "${archives[0]}" -d source
          fi

          GRADLEW=$(find . -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            find . -maxdepth 5 -type d
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentVPN-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          
